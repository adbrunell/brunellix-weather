name: Populate Weather Archive

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download missing station data
        run: |
          IEM="https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
          ICAOS=$(jq -r '.[].icao' data/stations.json)

          for icao in $ICAOS; do
            NETWORK=$(jq -r ".[] | select(.icao==\"$icao\") | .network" data/stations.json)
            for year in $(seq 2015 2025); do
              FILE="data/${icao}/${year}.csv"
              if [ ! -f "$FILE" ]; then
                echo "Downloading ${icao} ${year}..."
                mkdir -p "data/${icao}"
                curl -f -s -S \
                  "${IEM}?station=${icao}&data=tmpf,dwpf,alti,mslp,drct,sknt,gust&year1=${year}&month1=1&day1=1&year2=${year}&month2=12&day2=31&report_type=3&tz=Etc/UTC&format=onlycomma" \
                  -o "$FILE" || echo "WARNING: ${icao} ${year} failed or empty"
                sleep 1
              fi
            done
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: weekly archive update [skip ci]"
          git push
