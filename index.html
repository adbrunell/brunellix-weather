<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrunelliX Weather</title>
<style>
:root{--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono','Consolas',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);font-size:0.8125rem;color:#202124;background:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hdr-bar{height:2.25rem;background:#f1f3f4;border-bottom:1px solid #dadce0;display:flex;align-items:center;padding:0 .75rem;font-weight:700;font-size:.875rem;flex-shrink:0}
.hdr-bar span{color:#1a73e8}
.wrap{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
th,td{border-right:1px solid #e8eaed;border-bottom:1px solid #e8eaed;height:1.875rem;padding:0 .25rem;white-space:nowrap;overflow:hidden;text-align:center;vertical-align:middle;font-size:.75rem}
thead th{background:#f1f3f4;font-weight:600;position:sticky;z-index:5;font-size:.6875rem}
thead tr:nth-child(2) th{top:1.75rem}
thead tr:nth-child(3) th{top:3.25rem}
th.group{height:1.75rem;font-size:.75rem}
th.units{font-weight:400;color:#5f6368;font-size:.625rem;height:1.5rem}
th.hdr-summer{background:#FF0000!important;color:#fff!important}
th.hdr-autumn{background:#FFFF99!important;color:#202124!important}
th.hdr-spring{background:#FFCC66!important;color:#202124!important}
th.hdr-details{background:#d6d9dc!important;color:#202124!important}
td.inp{background:#E8E8E8;padding:0}
td.inp input{width:100%;height:100%;border:none;background:transparent;font-family:var(--mono);font-size:.75rem;text-align:center;outline:none;padding:0 .125rem}
td.inp input:focus{background:#fff;box-shadow:inset 0 0 0 1px #1a73e8}
td.inp .loading{background:#fff8e1}
td.res{font-family:var(--mono);font-weight:600}
td.res-err{color:#d93025;font-family:var(--mono);font-weight:600}
.c0{width:76px}.c1{width:56px}.c2{width:64px}.c3{width:64px}.c4{width:64px}.c5{width:66px}.c6{width:64px}.c7{width:66px}.c8{width:64px}.c9{width:66px}.c10{width:64px}.c11{width:66px}.c12{width:64px}.c13{width:66px}.c14{width:68px}.c15{width:72px}
col.c0{width:76px}col.c1{width:56px}col.c2{width:64px}col.c3{width:64px}col.c4{width:64px}col.c5{width:66px}col.c6{width:64px}col.c7{width:66px}col.c8{width:64px}col.c9{width:66px}col.c10{width:64px}col.c11{width:66px}col.c12{width:64px}col.c13{width:66px}col.c14{width:68px}col.c15{width:72px}
.status{height:1.5rem;line-height:1.5rem;padding:0 .75rem;font-size:.6875rem;color:#5f6368;background:#f1f3f4;border-top:1px solid #dadce0;flex-shrink:0}
.status.err{color:#d93025}
.footer{height:1.375rem;line-height:1.375rem;padding:0 .75rem;text-align:center;font-size:.625rem;color:#9aa0a6;border-top:1px solid #e8eaed;flex-shrink:0}
.footer a{color:#1a73e8;text-decoration:none}
</style>
</head>
<body>
<div class="hdr-bar">BrunelliX <span>Weather</span></div>
<div class="wrap">
<table>
<colgroup>
<col class="c0"><col class="c1"><col class="c2"><col class="c3">
<col class="c4"><col class="c5"><col class="c6"><col class="c7">
<col class="c8"><col class="c9"><col class="c10"><col class="c11">
<col class="c12"><col class="c13"><col class="c14"><col class="c15">
</colgroup>
<thead>
<tr>
<th class="group" colspan="2">PERIOD</th>
<th class="group" colspan="2">ANNUAL</th>
<th class="group hdr-summer" colspan="2">SUMMER</th>
<th class="group hdr-autumn" colspan="2">AUTUMN</th>
<th class="group" colspan="2">WINTER</th>
<th class="group hdr-spring" colspan="2">SPRING</th>
<th class="group hdr-details" colspan="2">STATION DETAILS</th>
</tr>
<tr>
<th>INPUT</th><th>RELIAB.</th><th>INITIAL</th><th>FINAL</th>
<th>TEMP</th><th>PRESS</th><th>TEMP</th><th>PRESS</th>
<th>TEMP</th><th>PRESS</th><th>TEMP</th><th>PRESS</th>
<th>TEMP</th><th>PRESS</th><th>ID</th><th>DIST NM</th>
</tr>
<tr class="units">
<th>[Apt Code]</th><th>[%]</th><th>HOUR</th><th>HOUR</th>
<th>[&deg;C]</th><th>[hPa]</th><th>[&deg;C]</th><th>[hPa]</th>
<th>[&deg;C]</th><th>[hPa]</th><th>[&deg;C]</th><th>[hPa]</th>
<th>[&deg;C]</th><th>[hPa]</th><th>ID</th><th>DIST [NM]</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div class="status" id="status"></div>
<div class="footer">Airport data: <a href="https://ourairports.com" target="_blank" rel="noopener">OurAirports</a> &middot; Weather: <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">IEM</a> &middot; <a href="https://github.com/adbrunell/brunellix-weather" target="_blank" rel="noopener">GitHub</a></div>
<script src="app.js"></script>
</body>
</html>
