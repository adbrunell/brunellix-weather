<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aerodrome climatology — historical weather statistics for airport performance planning.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://adbrunell.github.io/brunellix-weather/">
<title>BrunelliX Weather</title>
<link rel="stylesheet" href="grid-core.css">
<style>
:root{--accent:#1a73e8;--border:#dadce0;--bg:#f8f9fa;--text:#202124;--text-dim:#5f6368;--radius:6px;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono','Fira Code','Consolas',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);font-size:0.8125rem;color:var(--text);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:1px solid var(--border);padding:0 1rem;height:3rem;display:flex;align-items:center;gap:0.5rem}
.header-logo{font-weight:700;font-size:1rem;color:var(--text)}
.header-logo span{color:var(--accent)}
.form-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0.375rem;padding:0.5rem 0.75rem;background:#fff;border-bottom:1px solid var(--border)}
.form-bar label{font-size:0.6875rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;display:block;margin-bottom:0.125rem}
.form-bar input{height:2.25rem;padding:0 0.375rem;font-family:var(--mono);font-size:0.8125rem;border:1px solid var(--border);border-radius:var(--radius);outline:none}
.form-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,115,232,0.2)}
.inp-code{width:4.5rem;text-transform:uppercase;font-weight:600;letter-spacing:0.04em}
.inp-pct{width:3rem;text-align:center}
.inp-time{width:4rem;text-align:center}
.btn-go{height:2.25rem;padding:0 0.875rem;font-size:0.8125rem;font-weight:600;font-family:var(--font);color:#fff;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn-go:hover{background:#1557b0}
.status-msg{padding:0.375rem 0.75rem;font-size:0.75rem;color:var(--text-dim);display:none}
.status-msg.visible{display:block}
.status-msg.error{color:#d93025}
.footer{padding:0.5rem 0.75rem;text-align:center;font-size:0.6875rem;color:var(--text-dim);border-top:1px solid var(--border);margin-top:auto}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{text-decoration:underline}
#results-grid{flex:1;min-height:0}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">BrunelliX <span>Weather</span></div>
</header>

<div class="form-bar">
  <div><label>Code</label><input type="text" id="inp-code" class="inp-code" placeholder="SBKP" maxlength="4" autocomplete="off" spellcheck="false"></div>
  <div><label>Reliab.</label><input type="number" id="inp-rel" class="inp-pct" value="85" min="50" max="99"></div>
  <div><label>Start (UTC)</label><input type="text" id="inp-start" class="inp-time" value="0:00" placeholder="H:MM"></div>
  <div><label>End (UTC)</label><input type="text" id="inp-end" class="inp-time" value="23:59" placeholder="H:MM"></div>
  <button type="button" class="btn-go" id="btn-search">Search</button>
</div>

<div class="status-msg" id="status-msg"></div>
<div id="results-grid"></div>

<footer class="footer">
  Airport data: <a href="https://ourairports.com" target="_blank" rel="noopener">OurAirports</a>
  &middot; Weather: <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">IEM</a>
  &middot; <a href="https://github.com/adbrunell/brunellix-weather" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="grid-core.js"></script>
<script src="app.js"></script>
</body>
</html>
